[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "self-driving-perceptron"
version = "1.0.0"
description = "Production-grade road segmentation DLOps pipeline on AWS SageMaker"
requires-python = ">=3.10"

dependencies = [
    "albumentations>=1.3",
    "mlflow>=2.8",
    "opencv-python-headless>=4.8",
    "pydantic>=2.0",
    "PyYAML>=6.0",
    "smart-open[s3]>=6.4"
]