# configs/aws/sagemaker.yaml

region: ${oc.env:AWS_DEFAULT_REGION,us-east-1}
account_id: ${oc.env:AWS_ACCOUNT_ID}

s3:
  bucket: ${oc.env:S3_BUCKET,road-seg-bucket}
  model_prefix: model-artifacts
  data_prefix: processed-data
  pipeline_prefix: pipelines

iam:
  execution_role_arn: ${oc.env:SAGEMAKER_ROLE_ARN}

ecr:
  repository: road-seg-inference
  image_tag: latest
  uri: ${aws.account_id}.dkr.ecr.${aws.region}.amazonaws.com/${aws.ecr.repository}:${aws.ecr.image_tag}

endpoint:
  name: road-seg-endpoint
  instance_type: ml.g4dn.xlarge
  instance_count: 1
  model_name: road-seg-model
  config_name: road-seg-config
  data_capture:
    enabled: true
    s3_prefix: s3://${aws.s3.bucket}/data-capture
    sampling_percentage: 20

autoscaling:
  enabled: true
  min_capacity: 1
  max_capacity: 4
  target_invocations_per_instance: 30
  scale_in_cooldown: 300
  scale_out_cooldown: 60

pipeline:
  name: road-seg-pipeline
  description: "End-to-end road segmentation MLOps pipeline"
  role_arn: ${aws.iam.execution_role_arn}

monitoring:
  baseline_s3_uri: s3://${aws.s3.bucket}/monitoring/baseline
  output_s3_uri: s3://${aws.s3.bucket}/monitoring/results
  schedule: cron(0 * ? * * *)    # hourly
  instance_type: ml.m5.xlarge
