# configs/monitoring/default.yaml

cloudwatch:
  namespace: RoadSegmentation
  dimensions:
    Environment: ${oc.env:ENV,development}
  alarms:
    high_latency_ms: 2000
    error_rate_pct: 5.0
    invocations_per_min_max: 1000

model_monitor:
  enabled: true
  constraints_violation_threshold: 0.1
  statistics_comparison_method: Comparison    # Comparison | Simple
  alert_sns_arn: ${oc.env:SNS_ALERT_ARN,""}

drift:
  feature_drift_threshold: 0.1   # PSI threshold for data drift
  performance_drop_threshold: 0.05  # absolute IoU drop triggers retrain

retraining:
  auto_trigger: true
  min_new_samples: 500           # trigger only if this many new labelled samples
  pipeline_name: ${aws.pipeline.name}
