# configs/inference/default.yaml

img_size: ${data.preprocessing.img_size}
threshold: 0.5                   # mask binarisation threshold
return_format: base64_png        # base64_png | s3_uri | numpy

postprocessing:
  apply_morphology: true
  kernel_size: 5                 # morphological open/close kernel
  min_road_area: 500             # remove blobs smaller than this (px²)
