# configs/training/default.yaml

epochs: 40
batch_size: ${data.dataloader.batch_size}   # inherit from data config

optimizer:
  name: adam
  learning_rate: 1.0e-4
  beta_1: 0.9
  beta_2: 0.999
  epsilon: 1.0e-7
  weight_decay: 0.0

loss:
  name: combined
  bce_weight: 0.5
  dice_weight: 0.5

metrics:
  - accuracy
  - iou_score
  - dice_coefficient
  - precision
  - recall

callbacks:
  early_stopping:
    enabled: true
    monitor: val_iou_score
    patience: 8
    mode: max
    restore_best_weights: true

  reduce_lr:
    enabled: true
    monitor: val_loss
    factor: 0.5
    patience: 4
    min_lr: 1.0e-7

  model_checkpoint:
    enabled: true
    monitor: val_iou_score
    mode: max
    save_best_only: true
    filepath: ${paths.artifacts}/checkpoints/best_model.keras

  tensorboard:
    enabled: true
    log_dir: ${paths.logs}/tensorboard
    histogram_freq: 1

sagemaker:
  instance_type: ml.g4dn.2xlarge
  instance_count: 1
  volume_size_gb: 50
  max_run_seconds: 86400         # 24h timeout
  use_spot: false
  checkpoint_s3_uri: s3://${data.s3.bucket}/checkpoints
  output_s3_uri: s3://${data.s3.bucket}/model-artifacts

fine_tuning:
  enabled: ${model.fine_tuning.enabled}
  start_epoch: 20                # unfreeze encoder after this many epochs
  epochs: 20
  learning_rate: 1.0e-5
