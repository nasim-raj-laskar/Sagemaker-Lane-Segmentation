# configs/config.yaml
# Root Hydra config — all sub-configs are composed here

defaults:
  - data: kitti
  - model: resnet_unet
  - training: default
  - inference: default
  - monitoring: default
  - aws: sagemaker
  - _self_

project:
  name: road-segmentation
  version: "0.1.0"
  description: "Binary road segmentation on KITTI using ResNet50-UNet"
  tags:
    - computer-vision
    - segmentation
    - kitti

paths:
  root: ${oc.env:PROJECT_ROOT,.}
  data_local: ${paths.root}/data
  artifacts: ${paths.root}/artifacts
  logs: ${paths.root}/logs
  notebooks: ${paths.root}/notebooks

mlflow:
  tracking_uri: ${oc.env:MLFLOW_TRACKING_URI,http://localhost:5000}
  experiment_name: road-segmentation
  run_name: null          # auto-generated if null
  log_artifacts: true
  log_model: true
  tags:
    team: mlops
    environment: ${oc.env:ENV,development}
