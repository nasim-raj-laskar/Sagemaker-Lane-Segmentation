project:
  name: self-driving-perceptron
  version: "1.0.0"
  description: "Road segmentation with ResNet-UNet on KITTI dataset"

aws:
  region: ap-south-1
  account_id: null                                                     
  s3_bucket: self-driving-perceptron
  s3_prefix:
    raw_images:  raw-data/image
    raw_masks:   raw-data/mask
    processed:   processed-data
    artifacts:   model-artifacts
    testing:     testing
    pipeline:    pipeline-artifacts

  sagemaker:
    role_name: SageMakerExecutionRole   # must exist in your account
    studio_domain_id: null              # optional, for programmatic launch
    instance_type:
      processing:   ml.g4dn.xlarge
      training:     ml.g4dn.xlarge
      inference:    ml.g4dn.xlarge
      batch:        ml.g4dn.xlarge

  ecr:
    training_image_repo:  perceptron-training
    inference_image_repo: perceptron-inference

  mlflow:
    tracking_uri: null    # e.g. http://<ec2-ip>:5000 or SM MLflow ARN
    experiment_name: road-segmentation

data:
  img_size: 256
  channels: 3
  num_classes: 1           # binary (road / not-road)
  val_split: 0.2
  random_seed: 42
  augmentation:
    enabled: true
    horizontal_flip: true
    brightness_range: [0.8, 1.2]
    contrast_range:   [0.8, 1.2]

model:
  architecture: resnet_unet
  backbone: resnet50
  backbone_weights: imagenet
  freeze_encoder: false
  dropout_rate: 0.3
  decoder_filters: [512, 256, 128, 64]

training:
  epochs: 5
  batch_size: 8
  learning_rate: 1.0e-4
  optimizer: adam
  loss: binary_crossentropy
  metrics: [accuracy, iou]
  early_stopping:
    enabled: true
    patience: 8
    monitor: val_iou
    mode: max
  reduce_lr:
    enabled: true
    factor: 0.5
    patience: 4
    min_lr: 1.0e-7
  checkpoint:
    save_best_only: true
    monitor: val_iou

inference:
  threshold: 0.5
  overlay_color: [0, 255, 0]   # BGR green road overlay
  endpoint_name: road-seg-endpoint

monitoring:
  data_quality:
    enabled: true
    schedule: cron(0 * ? * * *)   # hourly
  model_quality:
    enabled: true
  alert_threshold:
    accuracy_drop: 0.05           # alert if val acc drops >5%

pipeline:
  name: road-seg-pipeline
  description: "Preprocess → Train → Evaluate → Register"
  approval_required: true         # manual approval before deploy
